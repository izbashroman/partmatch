name: Update price match report

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "parser/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r parser/requirements.txt

      - name: Run parser (writes into docs/)
        working-directory: parser
        run: python main.py --out-dir ../docs

      - name: Commit updated report if changed
        run: |
          git config user.name "price-match-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/report.csv docs/unmatched_supplier_offers.csv
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update report ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
